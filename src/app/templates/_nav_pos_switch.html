<div class="chrome-switch nav-pos-switch" role="group" aria-label="Posição do menu">
    <button
        type="button"
        class="chrome-option"
        data-nav-pos-option="top"
        aria-pressed="true"
        aria-label="Menu no topo"
        title="Topo"
    >
        <span class="material-symbols-outlined" aria-hidden="true">toolbar</span>
    </button>
    <button
        type="button"
        class="chrome-option"
        data-nav-pos-option="left"
        aria-pressed="false"
        aria-label="Menu à esquerda"
        title="Esquerda"
    >
        <span class="material-symbols-outlined" aria-hidden="true">view_sidebar</span>
    </button>
</div>
