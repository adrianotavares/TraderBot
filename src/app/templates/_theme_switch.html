<div class="theme-switch" role="group" aria-label="Aparência da tela">
    <button
        type="button"
        class="theme-option"
        data-theme-option="light"
        aria-pressed="true"
        aria-label="Lights"
        title="Lights"
    >
        <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
    </button>
    <button
        type="button"
        class="theme-option"
        data-theme-option="dark"
        aria-pressed="false"
        aria-label="Dark"
        title="Dark"
    >
        <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
    </button>
</div>
