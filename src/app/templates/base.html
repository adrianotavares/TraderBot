<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}TraderBot{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/app.css') }}"
        />
    </head>
    <body>
        <header class="app-bar">
            <div class="brand">
                <span class="material-symbols-outlined">candlestick_chart</span>
                TraderBot
            </div>
            <nav>
                <a
                    href="{{ url_for('routes.dashboard') }}"
                    class="{{ 'active' if active_page == 'tracking' else '' }}"
                    >Tracking</a
                >
                <a
                    href="{{ url_for('routes.profit_page') }}"
                    class="{{ 'active' if active_page == 'profit' else '' }}"
                    >Profit</a
                >
                <a
                    href="{{ url_for('routes.config_page') }}"
                    class="{{ 'active' if active_page == 'config' else '' }}"
                    >Config</a
                >
            </nav>
            <div class="app-bar-end">
                <span
                    class="env-badge {{ environment }}"
                    title="Ambiente definido em {{ environment_source }}"
                    >{{ environment }}</span
                >
                {% if auth_enabled and authenticated %}
                <form method="post" action="{{ url_for('routes.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
                    <button type="submit" class="icon-btn" title="Encerrar sessão">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </form>
                {% endif %}
            </div>
        </header>
        <main>{% block content %}{% endblock %}</main>
        <script>
            window.TRADERBOT_CSRF = {{ csrf_token|default("", true)|tojson }};
            window.TRADERBOT_AUTH = {{ (auth_enabled or false)|tojson }};
            window.traderbotFetch = function (url, options) {
                options = options || {};
                const headers = Object.assign({}, options.headers || {});
                const method = (options.method || "GET").toUpperCase();
                if (
                    window.TRADERBOT_CSRF &&
                    method !== "GET" &&
                    method !== "HEAD"
                ) {
                    headers["X-TraderBot-CSRF"] = window.TRADERBOT_CSRF;
                }
                options.headers = headers;
                options.credentials = "same-origin";
                return fetch(url, options).then(function (response) {
                    if (response.status === 401 && window.TRADERBOT_AUTH) {
                        window.location.href = "/login";
                    }
                    return response;
                });
            };
        </script>
        {% block scripts %}{% endblock %}
    </body>
</html>
