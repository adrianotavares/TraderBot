{% extends "base.html" %}
{% block title %}Configuração{% endblock %}
{% block content %}
<h1>Configuração</h1>
<p class="subtitle">
    Risco, timing, regime e grid valem no próximo ciclo. Troca de par ou
    estratégia principal exige restart do bot.
</p>

<form id="config-form" class="form-card">
    <div class="field">
        <label for="MAIN_STRATEGY">Estratégia principal</label>
        <select name="MAIN_STRATEGY" id="MAIN_STRATEGY">
            <option value="weapon_candle">Weapon Candle</option>
            <option value="atr_trend">ATR Trend (4h)</option>
            <option value="ut_bot_alerts">UT Bot Alerts</option>
            <option value="vortex">Vortex</option>
            <option value="moving_average">Média Móvel</option>
            <option value="moving_average_antecipation">
                Média Móvel Antecipação
            </option>
            <option value="rsi">RSI</option>
            <option value="ma_rsi_volume">MA + RSI + Volume</option>
        </select>
    </div>

    <div class="field">
        <label for="FALLBACK_ACTIVATED">Estratégia de fallback</label>
        <select name="FALLBACK_ACTIVATED" id="FALLBACK_ACTIVATED">
            <option value="true">Ativada</option>
            <option value="false">Desativada</option>
        </select>
    </div>

    <div class="row">
        <div class="field">
            <label for="ACCEPTABLE_LOSS_PERCENTAGE">Perda aceitável (%)</label>
            <input
                type="number"
                name="ACCEPTABLE_LOSS_PERCENTAGE"
                id="ACCEPTABLE_LOSS_PERCENTAGE"
                step="0.1"
            />
        </div>
        <div class="field">
            <label for="STOP_LOSS_PERCENTAGE">Stop loss (%)</label>
            <input
                type="number"
                name="STOP_LOSS_PERCENTAGE"
                id="STOP_LOSS_PERCENTAGE"
                step="0.1"
            />
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label for="TEMPO_ENTRE_TRADES">Intervalo entre trades (s)</label>
            <input
                type="number"
                name="TEMPO_ENTRE_TRADES"
                id="TEMPO_ENTRE_TRADES"
            />
        </div>
        <div class="field">
            <label for="DELAY_ENTRE_ORDENS">Atraso entre ordens (s)</label>
            <input
                type="number"
                name="DELAY_ENTRE_ORDENS"
                id="DELAY_ENTRE_ORDENS"
            />
        </div>
    </div>

    <h2 style="font-size: 1.05rem; font-weight: 500; margin: 8px 0 4px">
        Moedas negociadas
    </h2>
    <div id="stocks-container"></div>

    <button type="submit" class="btn-primary">Salvar</button>
</form>
<div id="toast" class="toast"></div>
{% endblock %}

{% block scripts %}
<script>
    function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.style.display = "block";
        setTimeout(() => {
            toast.style.display = "none";
        }, 2800);
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    async function carregarConfiguracao() {
        const response = await traderbotFetch("/get-config");
        const data = await response.json();

        document.getElementById("MAIN_STRATEGY").value = data.MAIN_STRATEGY;
        document.getElementById("FALLBACK_ACTIVATED").value =
            data.FALLBACK_ACTIVATED.toString();
        document.getElementById("ACCEPTABLE_LOSS_PERCENTAGE").value =
            data.ACCEPTABLE_LOSS_PERCENTAGE;
        document.getElementById("STOP_LOSS_PERCENTAGE").value =
            data.STOP_LOSS_PERCENTAGE;
        document.getElementById("TEMPO_ENTRE_TRADES").value =
            data.TEMPO_ENTRE_TRADES;
        document.getElementById("DELAY_ENTRE_ORDENS").value =
            data.DELAY_ENTRE_ORDENS;

        const stocksContainer = document.getElementById("stocks-container");
        stocksContainer.innerHTML = "";
        data.stocks_traded_list.forEach((stock, index) => {
            stocksContainer.innerHTML += `
                <div class="stock-row">
                    <div class="field">
                        <label>Moeda ${index + 1}</label>
                        <input type="text" class="stock-code" value="${escapeHtml(stock.stockCode)}">
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Par</label>
                            <input type="text" class="stock-operation" value="${escapeHtml(stock.operationCode)}">
                        </div>
                        <div class="field">
                            <label>Quantidade</label>
                            <input type="number" class="stock-quantity" step="any" value="${escapeHtml(stock.tradedQuantity)}">
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function buildStocksTradedList() {
        const stocks = [];
        document.querySelectorAll("#stocks-container .stock-row").forEach((row) => {
            stocks.push({
                stockCode: row.querySelector(".stock-code").value.trim(),
                operationCode: row.querySelector(".stock-operation").value.trim(),
                tradedQuantity: parseFloat(
                    row.querySelector(".stock-quantity").value
                ),
            });
        });
        return stocks;
    }

    document.getElementById("config-form").onsubmit = async function (e) {
        e.preventDefault();
        const jsonData = {
            MAIN_STRATEGY: document.getElementById("MAIN_STRATEGY").value,
            FALLBACK_ACTIVATED:
                document.getElementById("FALLBACK_ACTIVATED").value === "true",
            ACCEPTABLE_LOSS_PERCENTAGE: parseFloat(
                document.getElementById("ACCEPTABLE_LOSS_PERCENTAGE").value
            ),
            STOP_LOSS_PERCENTAGE: parseFloat(
                document.getElementById("STOP_LOSS_PERCENTAGE").value
            ),
            TEMPO_ENTRE_TRADES: parseInt(
                document.getElementById("TEMPO_ENTRE_TRADES").value,
                10
            ),
            DELAY_ENTRE_ORDENS: parseInt(
                document.getElementById("DELAY_ENTRE_ORDENS").value,
                10
            ),
            stocks_traded_list: buildStocksTradedList(),
        };

        const response = await traderbotFetch("/update-config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(jsonData),
        });

        if (!response.ok) {
            const error = await response.json();
            showToast(error.error || "Erro ao salvar configuração.");
            return;
        }

        showToast("Configuração salva. Limites valem no próximo ciclo; par/estratégia exigem restart.");
        carregarConfiguracao();
    };

    carregarConfiguracao();
</script>
{% endblock %}
